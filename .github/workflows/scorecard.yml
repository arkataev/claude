# The step scorecard (ci/PILOT.md): deterministic checks of one step's PR and the project's own
# gate, merged into one comment and one status. No model runs here. A project calls it on every
# pull_request event.
name: flow-scorecard

on:
  workflow_call:
    inputs:
      source:
        description: "Globs of the source files, comma-separated: counted for size, read for the interface."
        type: string
        default: "src/*"
      tests:
        description: "Globs of the test files: reported for size, never capped; read for citations."
        type: string
        default: "tests/*,*/tests/*,*test_*.py"
      ignored:
        description: "Globs left out of the size: generated and lock files."
        type: string
        default: "uv.lock,*.lock"
      setup:
        description: "The project's install command, run before the gate."
        type: string
        default: "uv sync --locked"
      gate:
        description: "The project's gate; `make -k test` shows every failing step at once."
        type: string
        default: "make -k test"
      warn:
        type: number
        default: 400
      fail:
        type: number
        default: 800
      flow_repo:
        type: string
        default: "arkataev/claude"
      flow_ref:
        description: "Keep equal to the ref in the caller's `uses:` line."
        type: string
        default: "feature/flow-ci-pilot"
    secrets:
      FLOW_REPO_TOKEN:
        description: "Read access to the flow repo, needed only while it is private."
        required: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flow_repo }}
          ref: ${{ inputs.flow_ref }}
          path: .flow
          token: ${{ secrets.FLOW_REPO_TOKEN || github.token }}
      - run: mv .flow "$RUNNER_TEMP/flow"
      - uses: astral-sh/setup-uv@v6
      - name: Project setup
        run: ${{ inputs.setup }}
      - name: Gate
        env:
          GATE: ${{ inputs.gate }}
          RUFF_OUTPUT_FORMAT: github
        run: python3 "$RUNNER_TEMP/flow/ci/run_gate.py" --command "$GATE" --result "$RUNNER_TEMP/results/gate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: result-gate
          path: ${{ runner.temp }}/results/
          retention-days: 14

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flow_repo }}
          ref: ${{ inputs.flow_ref }}
          path: flow
          token: ${{ secrets.FLOW_REPO_TOKEN || github.token }}
      - name: Run the checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_DIR: head
          OUT: results
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SOURCE: ${{ inputs.source }}
          TESTS: ${{ inputs.tests }}
          IGNORED: ${{ inputs.ignored }}
          WARN: ${{ inputs.warn }}
          FAIL: ${{ inputs.fail }}
        run: bash flow/ci/run_checks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: result-checks
          path: results/
          retention-days: 14

  report:
    needs: [gate, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flow_repo }}
          ref: ${{ inputs.flow_ref }}
          path: flow
          token: ${{ secrets.FLOW_REPO_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results
      - name: Merge
        run: |
          # A check whose job broke before it wrote a result still shows, as a failure.
          for check in gate size scenarios interface; do
            [ -f "results/$check.json" ] || printf '{"check": "%s", "state": "fail", "headline": "no result: its job broke first (see the run)", "details": ""}' "$check" > "results/$check.json"
          done
          python3 flow/ci/scorecard.py --results results --comment comment.md --state state.txt
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment and label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One comment per PR, edited on each push, so the PR does not fill with scorecards.
          existing="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            -q '.[] | select(.body | startswith("<!-- flow-scorecard -->")) | .id' | head -n1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
          size="$(python3 -c 'import json; print(json.load(open("results/size.json"))["state"])')"
          gh label create large -R "$REPO" --color FBCA04 --description "Step over the size warning" --force > /dev/null
          if [ "$size" = pass ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/large" > /dev/null 2>&1 || true
          else
            gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=large" > /dev/null
          fi
      - name: Verdict
        run: |
          state="$(cat state.txt)"
          echo "scorecard: $state"
          [ "$state" != fail ]
