# The step-size check (ci/PILOT.md): one PR per step, its source lines held to a cap. No model
# runs here; it takes seconds. A project calls it on every pull_request event.
name: flow-size

on:
  workflow_call:
    inputs:
      source:
        description: "Globs of the source files, comma-separated; only these count."
        type: string
        default: "src/*"
      tests:
        description: "Globs of the test files: reported, never capped."
        type: string
        default: "tests/*,*/tests/*,*test_*.py"
      ignored:
        description: "Globs left out: generated and lock files."
        type: string
        default: "uv.lock,*.lock"
      warn:
        type: number
        default: 400
      fail:
        type: number
        default: 800
      flow_repo:
        type: string
        default: "arkataev/claude"
      flow_ref:
        description: "Keep equal to the ref in the caller's `uses:` line."
        type: string
        default: "feature/flow-ci-pilot"
    secrets:
      FLOW_REPO_TOKEN:
        description: "Read access to the flow repo, needed only while it is private."
        required: false

permissions: {}

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flow_repo }}
          ref: ${{ inputs.flow_ref }}
          path: flow
          token: ${{ secrets.FLOW_REPO_TOKEN || github.token }}
      - name: Count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          SOURCE: ${{ inputs.source }}
          TESTS: ${{ inputs.tests }}
          IGNORED: ${{ inputs.ignored }}
          WARN: ${{ inputs.warn }}
          FAIL: ${{ inputs.fail }}
        run: |
          gh api --paginate --slurp "repos/$REPO/pulls/$PR/files" \
            | python3 -c 'import json,sys; print(json.dumps([f for page in json.load(sys.stdin) for f in page]))' > files.json
          printf '%s' "$BODY" > body.txt
          python3 flow/ci/pr_size.py --files files.json --labels "$LABELS" --body body.txt \
            --source "$SOURCE" --tests "$TESTS" --ignored "$IGNORED" --warn "$WARN" --fail "$FAIL" \
            --comment comment.md --result result.json
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment and label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One comment per PR, edited on each push, so the PR does not fill with size reports.
          existing="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            -q '.[] | select(.body | startswith("<!-- flow-size -->")) | .id' | head -n1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
          state="$(python3 -c 'import json; print(json.load(open("result.json"))["state"])')"
          gh label create large -R "$REPO" --color FBCA04 --description "Step over the size warning" --force > /dev/null
          if [ "$state" = pass ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/large" > /dev/null 2>&1 || true
          else
            gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=large" > /dev/null
          fi
      - name: Verdict
        run: |
          state="$(python3 -c 'import json; print(json.load(open("result.json"))["state"])')"
          echo "step size: $state"
          [ "$state" != fail ]
