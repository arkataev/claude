# The pilot of the CI review (ci/PILOT.md): the reviewer agent run once per lens on a PR, the
# findings merged and posted as one PR review. A project calls it from its own workflow on a
# `/review <brief>` comment.
name: flow-review

on:
  workflow_call:
    inputs:
      pr:
        type: number
        required: true
      command:
        description: "The comment that asked for the review: `/review <brief path> [lens,lens,...]`."
        type: string
        required: true
      lenses:
        description: "The lenses when the comment names none, comma-separated."
        type: string
        default: "tests,correctness,design"
      agent:
        description: "The reviewer agent of the project's flow: reviewer or solid-reviewer."
        type: string
        default: "reviewer"
      source:
        description: "The scorecard's source globs, so the reviewer sees the rows the PR shows."
        type: string
        default: "src/*"
      tests:
        type: string
        default: "tests/*,*/tests/*,*test_*.py"
      ignored:
        type: string
        default: "uv.lock,*.lock"
      setup:
        description: "The project's install command, run before the gate."
        type: string
        default: "uv sync --locked"
      gate:
        description: "The project's gate, run once before the reviewers."
        type: string
        default: "make -k test"
      flow_repo:
        type: string
        default: "arkataev/claude"
      flow_ref:
        description: "Keep equal to the ref in the caller's `uses:` line."
        type: string
        default: "feature/flow-ci-pilot"
      claude_version:
        type: string
        default: "2.1.332"
      budget_usd:
        description: "Per lens; the run stops past it."
        type: string
        default: "3"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      FLOW_REPO_TOKEN:
        description: "Read access to the flow repo, needed only while it is private."
        required: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      brief: ${{ steps.read.outputs.brief }}
      lenses: ${{ steps.read.outputs.lenses }}
      head: ${{ steps.read.outputs.head }}
      base: ${{ steps.read.outputs.base }}
    steps:
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ inputs.command }}
          DEFAULT_LENSES: ${{ inputs.lenses }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          brief="$(printf '%s' "$COMMAND" | head -n1 | awk '{print $2}')"
          case "$brief" in
            ''|*[!A-Za-z0-9._/-]*|/*|*..*) echo "::error::usage: /review <brief path in the repo>"; exit 1 ;;
          esac
          lenses="$(printf '%s' "$COMMAND" | head -n1 | awk '{print $3}')"
          lenses="${lenses:-$DEFAULT_LENSES}"
          case "$lenses" in
            *[!a-z,-]*|,*|*,|*,,*) echo "::error::lenses are names split by commas: tests,correctness"; exit 1 ;;
          esac
          echo "brief=$brief" >> "$GITHUB_OUTPUT"
          echo "lenses=$(printf '%s' "$lenses" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split(",")))')" >> "$GITHUB_OUTPUT"
          gh pr view "$PR" -R "$REPO" --json headRefOid,baseRefName \
            -q '"head=\(.headRefOid)\nbase=\(.baseRefName)"' >> "$GITHUB_OUTPUT"
          gh pr comment "$PR" -R "$REPO" --body "Flow review started for \`$brief\`, lenses \`$lenses\`: $RUN_URL"

  gate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.read.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flow_repo }}
          ref: ${{ inputs.flow_ref }}
          path: .flow
          token: ${{ secrets.FLOW_REPO_TOKEN || github.token }}
      - run: mv .flow "$RUNNER_TEMP/flow"
      - uses: astral-sh/setup-uv@v6
      - name: Project setup
        run: ${{ inputs.setup }}
      - name: Gate
        env:
          GATE: ${{ inputs.gate }}
          RUFF_OUTPUT_FORMAT: github
        run: python3 "$RUNNER_TEMP/flow/ci/run_gate.py" --command "$GATE" --result "$RUNNER_TEMP/scorecard/gate.json"
      - id: read
        run: |
          python3 -c 'import json,sys; g=json.load(open(sys.argv[1])); print("state=" + g["state"])' "$RUNNER_TEMP/scorecard/gate.json" >> "$GITHUB_OUTPUT"
      # The reviewers get the scorecard's rows, so they spend no findings on what it reports.
      # A check that breaks here leaves the review to run without its row.
      - name: Scorecard checks
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_DIR: .
          OUT: ${{ runner.temp }}/scorecard
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SOURCE: ${{ inputs.source }}
          TESTS: ${{ inputs.tests }}
          IGNORED: ${{ inputs.ignored }}
        run: bash "$RUNNER_TEMP/flow/ci/run_checks.sh"
      - name: Summary for the reviewers
        run: |
          python3 "$RUNNER_TEMP/flow/ci/scorecard.py" --results "$RUNNER_TEMP/scorecard" \
            --comment "$RUNNER_TEMP/comment.md" --state "$RUNNER_TEMP/state.txt" --summary "$RUNNER_TEMP/scorecard/summary.txt"
          cat "$RUNNER_TEMP/scorecard/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: ${{ runner.temp }}/scorecard/
          retention-days: 14

  # A step that does not build is not worth a reviewer's time or the plan's usage.
  gate-failed:
    needs: [prepare, gate]
    if: always() && needs.prepare.result == 'success' && needs.gate.outputs.state != 'pass'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: scorecard
          path: scorecard
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Flow review skipped: the gate failed"
            echo
            if [ -f scorecard/gate.json ]; then
              python3 -c 'import json; g=json.load(open("scorecard/gate.json")); print(g["headline"]); print(); print(g["details"])'
            else
              echo "The gate job broke before it wrote a result; see the run."
            fi
            echo
            echo "Fix the gate, then comment \`/review\` again."
          } > body.md
          gh pr comment "$PR" -R "$REPO" --body-file body.md

  lens:
    needs: [prepare, gate]
    if: needs.gate.outputs.state == 'pass'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lens: ${{ fromJSON(needs.prepare.outputs.lenses) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flow_repo }}
          ref: ${{ inputs.flow_ref }}
          path: .flow
          token: ${{ secrets.FLOW_REPO_TOKEN || github.token }}
      # Out of the workspace, so the reviewer sees neither the flow nor its own output as part of
      # the change.
      - run: mv .flow "$RUNNER_TEMP/flow"
      - uses: astral-sh/setup-uv@v6
      - name: Project setup
        run: ${{ inputs.setup }}
      - name: Install Claude Code and the flow
        env:
          CLAUDE_VERSION: ${{ inputs.claude_version }}
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_VERSION"
          bash "$RUNNER_TEMP/flow/ci/install_flow.sh" "$RUNNER_TEMP/flow"
      - uses: actions/download-artifact@v4
        with:
          name: scorecard
          path: ${{ runner.temp }}/scorecard
      - name: Make the PR's change uncommitted, as the reviewer agent reads it
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          git fetch --no-tags origin "$BASE"
          git reset --mixed "$(git merge-base "origin/$BASE" HEAD)"
          git status --short
      - name: Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LENS: ${{ matrix.lens }}
          AGENT: ${{ inputs.agent }}
          BRIEF: ${{ needs.prepare.outputs.brief }}
          BUDGET: ${{ inputs.budget_usd }}
        run: |
          python3 "$RUNNER_TEMP/flow/ci/run_lens.py" --lens "$LENS" --agent "$AGENT" --brief "$BRIEF" \
            --flow "$RUNNER_TEMP/flow" --budget "$BUDGET" --scorecard "$RUNNER_TEMP/scorecard/summary.txt" --out "$RUNNER_TEMP/out/$LENS.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lens-${{ matrix.lens }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

  merge:
    needs: [prepare, gate, lens]
    if: always() && needs.prepare.result == 'success' && needs.gate.outputs.state == 'pass'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.flow_repo }}
          ref: ${{ inputs.flow_ref }}
          path: flow
          token: ${{ secrets.FLOW_REPO_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: lens-*
          merge-multiple: true
          path: lenses
      - name: Merge and post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          gh pr diff "$PR" -R "$REPO" > pr.diff
          python3 flow/ci/merge_findings.py --lenses lenses --diff pr.diff --pr "$PR" \
            --commit "$HEAD" --out findings.json --review review.json --state state.txt
          gh api "repos/$REPO/pulls/$PR/reviews" --input review.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: findings
          path: findings.json
          retention-days: 90
      - name: Verdict
        run: |
          # A lens that gave no review (a refused login, a timeout) fails the run after the review
          # says so, so a silent reviewer never shows as a green, clean review.
          state="$(cat state.txt)"
          echo "review: $state"
          [ "$state" = ok ]
